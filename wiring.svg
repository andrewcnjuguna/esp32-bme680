<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" width="1280" height="960">

  <rect width="1280" height="960" fill="white"/>

  <!-- Title -->
  <text x="640" y="55" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold">
    ESP32 + BME680 + OLED (SH1106) I&#178;C Wiring
  </text>

  <!-- ESP32 DevKit V1 box -->
  <rect x="30" y="80" width="380" height="520" fill="white" stroke="black" stroke-width="3"/>
  <text x="70" y="270" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold">ESP32</text>
  <text x="70" y="310" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold">DevKit V1</text>

  <!-- ESP32 pin labels (right-aligned near right edge) -->
  <text x="400" y="170" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20">3V3</text>
  <text x="400" y="235" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20">GND</text>
  <text x="400" y="300" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20">GPIO21 / SDA</text>
  <text x="400" y="365" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20">GPIO22 / SCL</text>

  <!-- OLED (SH1106) 0x3C box -->
  <rect x="880" y="80" width="370" height="320" fill="white" stroke="black" stroke-width="3"/>
  <text x="1090" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold">OLED</text>
  <text x="1090" y="242" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold">(SH1106)</text>
  <text x="1090" y="284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold">0x3C</text>

  <!-- OLED pin labels -->
  <text x="892" y="170" font-family="Arial, Helvetica, sans-serif" font-size="20">VCC</text>
  <text x="892" y="235" font-family="Arial, Helvetica, sans-serif" font-size="20">GND</text>
  <text x="892" y="300" font-family="Arial, Helvetica, sans-serif" font-size="20">SDA</text>
  <text x="892" y="365" font-family="Arial, Helvetica, sans-serif" font-size="20">SCL</text>

  <!-- BME680 Module box -->
  <rect x="880" y="460" width="370" height="210" fill="white" stroke="black" stroke-width="3"/>
  <text x="1090" y="548" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold">BME680</text>
  <text x="1090" y="590" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold">Module</text>

  <!-- BME680 pin labels -->
  <text x="892" y="515" font-family="Arial, Helvetica, sans-serif" font-size="20">VIN / 3V3</text>
  <text x="892" y="560" font-family="Arial, Helvetica, sans-serif" font-size="20">GND</text>
  <text x="892" y="605" font-family="Arial, Helvetica, sans-serif" font-size="20">SDA</text>
  <text x="892" y="650" font-family="Arial, Helvetica, sans-serif" font-size="20">SCL</text>

  <!-- ── WIRES ──────────────────────────────────────────────────────────── -->
  <!-- Each wire has a staggered junction x where it branches down to BME680 -->
  <!-- Shared pin y-levels (ESP32 ↔ OLED): 3V3=165, GND=230, SDA=295, SCL=360 -->
  <!-- BME680 wire y-levels: VIN=510, GND=555, SDA=600, SCL=645             -->

  <!-- RED — 3V3 / VCC / VIN -->
  <line x1="410" y1="165" x2="600" y2="165" stroke="#CC0000" stroke-width="3.5"/>
  <line x1="600" y1="165" x2="880" y2="165" stroke="#CC0000" stroke-width="3.5"/>
  <line x1="600" y1="165" x2="600" y2="510" stroke="#CC0000" stroke-width="3.5"/>
  <line x1="600" y1="510" x2="880" y2="510" stroke="#CC0000" stroke-width="3.5"/>
  <circle cx="600" cy="165" r="8" fill="#CC0000"/>
  <circle cx="600" cy="510" r="8" fill="#CC0000"/>

  <!-- BLACK — GND -->
  <line x1="410" y1="230" x2="563" y2="230" stroke="#111111" stroke-width="3.5"/>
  <line x1="563" y1="230" x2="880" y2="230" stroke="#111111" stroke-width="3.5"/>
  <line x1="563" y1="230" x2="563" y2="555" stroke="#111111" stroke-width="3.5"/>
  <line x1="563" y1="555" x2="880" y2="555" stroke="#111111" stroke-width="3.5"/>
  <circle cx="563" cy="230" r="8" fill="#111111"/>
  <circle cx="563" cy="555" r="8" fill="#111111"/>

  <!-- GREEN — GPIO21 / SDA -->
  <line x1="410" y1="295" x2="526" y2="295" stroke="#008800" stroke-width="3.5"/>
  <line x1="526" y1="295" x2="880" y2="295" stroke="#008800" stroke-width="3.5"/>
  <line x1="526" y1="295" x2="526" y2="600" stroke="#008800" stroke-width="3.5"/>
  <line x1="526" y1="600" x2="880" y2="600" stroke="#008800" stroke-width="3.5"/>
  <circle cx="526" cy="295" r="8" fill="#008800"/>
  <circle cx="526" cy="600" r="8" fill="#008800"/>

  <!-- BLUE — GPIO22 / SCL -->
  <line x1="410" y1="360" x2="489" y2="360" stroke="#0000CC" stroke-width="3.5"/>
  <line x1="489" y1="360" x2="880" y2="360" stroke="#0000CC" stroke-width="3.5"/>
  <line x1="489" y1="360" x2="489" y2="645" stroke="#0000CC" stroke-width="3.5"/>
  <line x1="489" y1="645" x2="880" y2="645" stroke="#0000CC" stroke-width="3.5"/>
  <circle cx="489" cy="360" r="8" fill="#0000CC"/>
  <circle cx="489" cy="645" r="8" fill="#0000CC"/>

  <!-- ── LEGEND BOX (blue border) ──────────────────────────────────────── -->
  <rect x="30" y="645" width="415" height="190" fill="white" stroke="#0044CC" stroke-width="2.5"/>
  <text x="52" y="678" font-family="Arial, Helvetica, sans-serif" font-size="20">SDA &#8594; GPIO21</text>
  <text x="52" y="710" font-family="Arial, Helvetica, sans-serif" font-size="20">SCL &#8594; GPIO22</text>
  <text x="52" y="742" font-family="Arial, Helvetica, sans-serif" font-size="20">3V3 &#8594; 3.3V power for BME680 and OLED</text>
  <text x="52" y="774" font-family="Arial, Helvetica, sans-serif" font-size="20">GND &#8594; Common ground</text>
  <text x="52" y="806" font-family="Arial, Helvetica, sans-serif" font-size="20">OLED address: 0x3C</text>

  <!-- ── WARNING BOX (red border) ──────────────────────────────────────── -->
  <rect x="630" y="758" width="615" height="78" fill="white" stroke="#CC0000" stroke-width="2.5"/>
  <polygon points="668,820 694,780 720,820" fill="#FFDD00" stroke="#CC6600" stroke-width="2"/>
  <text x="694" y="817" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#CC6600">!</text>
  <text x="735" y="805" font-family="Arial, Helvetica, sans-serif" font-size="20">Check that the OLED module is 3.3V compatible.</text>

</svg>
